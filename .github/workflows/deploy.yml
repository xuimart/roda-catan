name: Deploy PWA no GitHub Pages

# Publica o site sempre que houver push na branch principal.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; mantém sempre o mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site (raiz do repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
